services:

  zookeeper-promos:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-promos
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "22181:2181"
    networks:
      - automatch-network

  kafka-promos:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-promos
    depends_on:
      - zookeeper-promos
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-promos:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-promos:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - automatch-network

  postgres:
    container_name: postgres-promos
    image: postgres:16
    environment:
      POSTGRES_DB: automatch_promos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - automatch-network

  promos-announcement-service:
    build: .
    container_name: automatch-promos
    depends_on:
      - postgres
      - kafka-promos
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-promos:5432/automatch_promos
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    ports:
      - "8082:8082"
    networks:
      - automatch-network


volumes:
  postgres_data:

networks:
  automatch-network:
    driver: bridge